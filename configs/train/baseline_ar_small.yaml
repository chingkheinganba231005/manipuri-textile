# Autoregressive baseline for experiment E1: the small backbone (~32M parameters) with causal
# attention over single cells in raster order (manitex.models.autoregressive).
# Same data, crop and samples per step as pretrain_small.yaml (comparison at equal data). With 4x
# more tokens per grid it costs ~5x the compute (about 990 vs 189 GFLOP per sample, forward +
# backward, with causal attention kernels): roughly 20-45 hours on an A100. For a comparison at
# equal compute use batch_size=25 grad_accum=2 (50 grids per step).
out_dir: runs/baseline_ar_small
model: {preset: small, arch: ar, patch: 1}
crop: 64
batch_size: 32          # x grad_accum 8 = 256 per step; ~48 GB of activations (~1.5 GB/sample)
grad_accum: 8
steps: 50000
lr: 4.0e-4
warmup: 2000
weight_decay: 0.05
ema_decay: 0.9995
precision: bf16
compile: true
num_workers: 16
p_uncond: 0.1
p_drop_field: 0.1
eval_every: 2000
eval_size: 512
sample_every: 10000
save_every: 5000
data:
  - type: procedural
    weight: 1.0
    styles: {moirang_phee: 0.3, phanek_mayek_naibi: 0.25, banded_motif: 0.2, check: 0.1, motif_tile: 0.15}
